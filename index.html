<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear usuario — Versión libre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<style>
  /* Paleta tomada de Source/Client/SmartFran.Cloud.Client.Component/Theme/AppTheme.cs */
  :root {
    --primary: #0F0035;
    --secondary: #6E59EE;
    --secondary-dark: #5842d8;
    --secondary-soft: #efecfd;
    --text: rgba(0, 0, 0, .87);
    --text-2: rgba(0, 0, 0, .6);
    --text-3: rgba(0, 0, 0, .38);
    --divider: rgba(0, 0, 0, .12);
    --outline: rgba(0, 0, 0, .23);
    --bg: #ffffff;
    --hover: rgba(0, 0, 0, .04);
    --radius: 3px;
    --drawer: 240px;
    --appbar: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.43; letter-spacing: .01071em; }
  .material-icons-outlined { font-size: 24px; line-height: 1; vertical-align: middle; user-select: none; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }

  /* Barra superior (MudAppBar Color.Primary, Elevation 5) */
  .appbar { position: fixed; inset: 0 0 auto 0; height: var(--appbar); background: var(--primary); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 24px 0 12px; z-index: 10;
    box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 5px 8px 0 rgba(0,0,0,.14), 0 1px 14px 0 rgba(0,0,0,.12); }
  .icon-btn { background: none; border: none; color: inherit; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: rgba(255,255,255,.08); }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .brand small { font-size: 11px; font-weight: 500; opacity: .7; margin-left: 8px; letter-spacing: .08em; }
  .spacer { flex: 1; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who .lines { display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 1.35; letter-spacing: .03333em; }

  /* Menú lateral (MudDrawer + MudNavMenu Bordered) */
  .drawer { position: fixed; top: var(--appbar); bottom: 0; left: 0; width: var(--drawer); background: #fff; border-right: 1px solid var(--divider); overflow-y: auto; padding: 12px; }
  .nav-group > button, .nav-link { width: 100%; display: flex; align-items: center; gap: 16px; padding: 8px 16px; border: none; background: none; color: rgba(0,0,0,.7); font-size: 14px; text-align: left; border-radius: var(--radius); cursor: pointer; text-decoration: none; }
  .nav-group > button:hover, .nav-link:hover { background: var(--hover); }
  .nav-group > button .chev { margin-left: auto; transition: transform .2s; }
  .nav-group.open > button .chev { transform: rotate(180deg); }
  .nav-items { display: none; padding-left: 16px; }
  .nav-group.open .nav-items { display: block; }
  .nav-link.active { color: var(--secondary); background: var(--secondary-soft); font-weight: 500; border-right: 2px solid var(--secondary); }

  .main { margin-left: var(--drawer); padding: calc(var(--appbar) + 16px) 24px 48px; }

  /* Tarjeta + formulario (MudCard Elevation 0, MudTextField Outlined Dense) */
  .card-header { padding: 16px; }
  h4 { margin: 0; font-size: 2.125rem; font-weight: 700; line-height: 1.235; letter-spacing: .00735em; }
  h6 { margin: 0; font-size: 1.25rem; font-weight: 500; line-height: 1.6; letter-spacing: .0075em; }
  .subtitle { color: var(--text-2); margin: 4px 0 0; }
  .card-content { padding: 0 16px 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .field { position: relative; }
  .field label { position: absolute; top: -8px; left: 10px; padding: 0 4px; background: #fff; font-size: 12px; color: var(--text-2); line-height: 16px; pointer-events: none; }
  .field input { width: 100%; height: 40px; padding: 10.5px 14px; border: 1px solid var(--outline); border-radius: var(--radius); font: inherit; color: var(--text); background: #fff; }
  .field input:hover { border-color: var(--text); }
  .field input:focus { outline: none; border: 2px solid var(--secondary); padding: 9.5px 13px; }
  .field:focus-within label { color: var(--secondary); }
  .helper { font-size: 12px; color: var(--text-2); margin: 4px 14px 0; letter-spacing: .03333em; }
  .chips-field { min-height: 40px; border: 1px solid var(--outline); border-radius: var(--radius); padding: 5px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 12px; border-radius: 16px; background: #e0e0e0; font-size: 13px; }
  .chip button { border: none; background: none; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(0,0,0,.54); }
  .chip button .material-icons-outlined { font-size: 18px; }
  .chip.add { background: none; border: 1px dashed var(--outline); padding: 0 12px; cursor: pointer; color: var(--text-2); }

  .section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--divider); }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .counter { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 16px; background: var(--secondary-soft); color: var(--secondary-dark); font-weight: 500; font-size: 13px; white-space: nowrap; }

  /* Funcionalidades (paneles tipo MudPaper Outlined) */
  .features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .feature { border: 1px solid var(--divider); border-radius: var(--radius); background: #fff; transition: border-color .15s, box-shadow .15s; }
  .feature.on { border-color: var(--secondary); box-shadow: 0 0 0 1px var(--secondary); }
  .feature-head { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
  .feature-head .material-icons-outlined { color: var(--text-2); }
  .feature.on .feature-head .material-icons-outlined { color: var(--secondary); }
  .feature-title { flex: 1; display: flex; flex-direction: column; }
  .feature-title strong { font-weight: 500; font-size: 15px; }
  .feature-title span { font-size: 12px; color: var(--text-2); }
  .feature-body { border-top: 1px solid var(--divider); padding: 4px 8px 8px; }
  .perm { display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 4px; border-radius: var(--radius); cursor: pointer; }
  .perm:hover { background: var(--hover); }
  .perm input { width: 18px; height: 18px; margin: 0 10px 0 4px; accent-color: var(--secondary); cursor: pointer; }
  .perm .label { flex: 1; }
  .tag-new { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #8a4b00; background: #ffe7c2; border-radius: 10px; padding: 2px 8px; }

  /* Interruptor (MudSwitch) */
  .switch { position: relative; width: 58px; height: 38px; border: none; background: none; cursor: pointer; padding: 0; flex-shrink: 0; }
  .switch .track { position: absolute; left: 12px; top: 12px; width: 34px; height: 14px; border-radius: 7px; background: rgba(0,0,0,.38); transition: background .15s; }
  .switch .thumb { position: absolute; left: 9px; top: 9px; width: 20px; height: 20px; border-radius: 50%; background: #fafafa; box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12); transition: transform .15s, background .15s; }
  .switch[aria-checked="true"] .track { background: var(--secondary); opacity: .5; }
  .switch[aria-checked="true"] .thumb { transform: translateX(20px); background: var(--secondary); }

  /* Acciones (MudCardActions) y botones (MudButton Filled) */
  .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 24px 16px 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 64px; height: 36px; padding: 6px 16px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; letter-spacing: .02857em; text-transform: uppercase; cursor: pointer; text-decoration: none;
    box-shadow: 0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12); }
  .btn-default { background: #e0e0e0; color: var(--text); }
  .btn-default:hover { background: #d5d5d5; }
  .btn-secondary { background: var(--secondary); color: #fff; }
  .btn-secondary:hover { background: var(--secondary-dark); }
  .btn-text { background: none; box-shadow: none; color: var(--secondary); padding: 6px 8px; }
  .btn-text:hover { background: var(--secondary-soft); }

  /* Snackbar (MudSnackbarProvider) */
  .snackbar { position: fixed; right: 24px; bottom: 24px; min-width: 288px; max-width: 480px; background: #323232; color: #fff; border-radius: 4px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
    box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12); transform: translateY(24px); opacity: 0; pointer-events: none; transition: all .2s; z-index: 20; }
  .snackbar.show { transform: none; opacity: 1; pointer-events: auto; }
  .snackbar.success .material-icons-outlined { color: #81c784; }
  .snackbar.error .material-icons-outlined { color: #e57373; }

  .proto-badge { position: fixed; right: 16px; top: calc(var(--appbar) + 12px); font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--secondary-dark); background: var(--secondary-soft); border: 1px solid #d6cffb; border-radius: 12px; padding: 4px 10px; }

  @media (max-width: 960px) {
    .drawer { display: none; }
    .main { margin-left: 0; }
    .grid, .features { grid-template-columns: minmax(0, 1fr); }
    h4 { font-size: 1.6rem; }
    .who .lines { display: none; }
    .proto-badge { display: none; }
  }
</style>
</head>
<body>

<header class="appbar">
  <button class="icon-btn" type="button" aria-label="Menú"><span class="material-icons-outlined">menu</span></button>
  <span class="brand">SmartFran<small>CLOUD</small></span>
  <span class="spacer"></span>
  <div class="who">
    <div class="lines">
      <span>franquiciado@demo.com</span>
      <span>Gestor: Franquicia Demo</span>
    </div>
    <span class="material-icons-outlined" style="font-size: 36px;">account_circle</span>
  </div>
</header>

<nav class="drawer" aria-label="Menú principal">
  <div class="nav-group"><button type="button"><span class="material-icons-outlined">dashboard</span>Tableros<span class="material-icons-outlined chev">expand_more</span></button></div>
  <div class="nav-group"><button type="button"><span class="material-icons-outlined">library_books</span>Catalogo<span class="material-icons-outlined chev">expand_more</span></button></div>
  <div class="nav-group"><button type="button"><span class="material-icons-outlined">inventory_2</span>Stock<span class="material-icons-outlined chev">expand_more</span></button></div>
  <div class="nav-group"><button type="button"><span class="material-icons-outlined">account_balance</span>Gestión<span class="material-icons-outlined chev">expand_more</span></button></div>
  <div class="nav-group open">
    <button type="button" aria-expanded="true"><span class="material-icons-outlined">security</span>Seguridad<span class="material-icons-outlined chev">expand_more</span></button>
    <div class="nav-items">
      <a class="nav-link active" href="#" aria-current="page"><span class="material-icons-outlined">person</span>Usuarios</a>
    </div>
  </div>
</nav>

<span class="proto-badge">PROTOTIPO · VERSIÓN LIBRE</span>

<main class="main">
  <form id="form" novalidate>
    <div class="card-header">
      <h4>Crear nuevo usuario</h4>
    </div>
    <div class="card-content">
      <div class="grid">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" value="martina.lopez@sucursal.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="dni">DNI</label>
          <input id="dni" type="text" inputmode="numeric" value="32.456.789" autocomplete="off">
        </div>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" value="Martina" autocomplete="off">
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" value="Lopez" autocomplete="off">
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label id="tiendas-label">Tiendas</label>
          <div class="chips-field" role="group" aria-labelledby="tiendas-label" id="tiendas"></div>
        </div>
      </div>

      <section class="section" aria-labelledby="perm-title">
        <div class="section-head">
          <div>
            <h6 id="perm-title">¿Qué va a hacer esta persona?</h6>
            <p class="subtitle">Activá las funcionalidades de su puesto. Dentro de cada una podés sacar o sumar permisos puntuales.</p>
          </div>
          <span class="counter" id="counter" aria-live="polite"></span>
        </div>
        <div class="features" id="features"></div>
      </section>
    </div>

    <div class="actions">
      <a class="btn btn-default" href="#">Volver</a>
      <button class="btn btn-secondary" type="submit">Guardar</button>
    </div>
  </form>
</main>

<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <span class="material-icons-outlined" id="snack-icon">check_circle</span>
  <span id="snack-text"></span>
</div>

<script>
  // Catálogo de funcionalidades y permisos (propuesta del analista; ver _handoff.md).
  var CATALOG = [
    { id: 'ventas',    name: 'Ventas',             icon: 'point_of_sale', perms: [['registrar', 'Registrar venta'], ['consultar', 'Consultar ventas'], ['anular', 'Anular venta']] },
    { id: 'caja',      name: 'Caja y turnos',      icon: 'schedule',      perms: [['abrir', 'Abrir turno'], ['cerrar', 'Cerrar turno'], ['ciego', 'Cierre ciego de caja', true]] },
    { id: 'stock',     name: 'Stock',              icon: 'inventory_2',   perms: [['vstock', 'Consultar stock'], ['mstock', 'Registrar movimientos de stock']] },
    { id: 'tesoreria', name: 'Tesorería',          icon: 'account_balance_wallet', perms: [['vmov', 'Consultar movimientos de caja'], ['rmov', 'Registrar ingresos y egresos'], ['depositos', 'Consultar depósitos de dinero']] },
    { id: 'informes',  name: 'Informes',           icon: 'assessment',    perms: [['iventas', 'Informe de ventas'], ['iturno', 'Informe de cierre de turno']] },
    { id: 'catalogo',  name: 'Catálogo y precios', icon: 'sell',          perms: [['vcat', 'Consultar catálogo'], ['vprec', 'Consultar listas de precio']] }
  ];

  var state = { on: {}, tiendas: ['Sucursal Palermo'] };
  var ALL_TIENDAS = ['Sucursal Palermo', 'Sucursal Belgrano', 'Sucursal Caballito'];

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function icon(name, style) { return el('span', { 'class': 'material-icons-outlined', 'aria-hidden': 'true', style: style || '', text: name }); }

  function renderTiendas() {
    var box = document.getElementById('tiendas');
    box.innerHTML = '';
    state.tiendas.forEach(function (t) {
      box.appendChild(el('span', { 'class': 'chip' }, [
        document.createTextNode(t),
        el('button', { type: 'button', 'aria-label': 'Quitar ' + t, onclick: function () {
          state.tiendas = state.tiendas.filter(function (x) { return x !== t; }); renderTiendas();
        } }, [icon('cancel')])
      ]));
    });
    var libres = ALL_TIENDAS.filter(function (t) { return state.tiendas.indexOf(t) < 0; });
    if (libres.length) {
      box.appendChild(el('button', { type: 'button', 'class': 'chip add', onclick: function () {
        state.tiendas.push(libres[0]); renderTiendas();
      } }, [document.createTextNode('+ Agregar tienda')]));
    }
  }

  function renderFeatures() {
    var box = document.getElementById('features');
    box.innerHTML = '';
    var featCount = 0, permCount = 0;
    CATALOG.forEach(function (f) {
      var ids = f.perms.map(function (p) { return p[0]; });
      var n = ids.filter(function (id) { return state.on[id]; }).length;
      var active = n > 0;
      if (active) featCount++;
      permCount += n;

      var sw = el('button', { type: 'button', 'class': 'switch', role: 'switch', 'aria-checked': String(active), 'aria-label': 'Activar ' + f.name,
        onclick: function () { ids.forEach(function (id) { state.on[id] = !active; }); renderFeatures(); } },
        [el('span', { 'class': 'track' }), el('span', { 'class': 'thumb' })]);

      var body = el('div', { 'class': 'feature-body' }, f.perms.map(function (p) {
        var id = 'perm-' + p[0];
        var cb = el('input', { type: 'checkbox', id: id, onchange: function (e) { state.on[p[0]] = e.target.checked; renderFeatures(); } });
        cb.checked = !!state.on[p[0]];
        return el('label', { 'class': 'perm', 'for': id }, [cb, el('span', { 'class': 'label', text: p[1] }), p[2] ? el('span', { 'class': 'tag-new', text: 'NUEVO' }) : null]);
      }));

      box.appendChild(el('div', { 'class': 'feature' + (active ? ' on' : '') }, [
        el('div', { 'class': 'feature-head' }, [
          icon(f.icon),
          el('div', { 'class': 'feature-title' }, [
            el('strong', { text: f.name }),
            el('span', { text: active ? (n + ' de ' + ids.length + ' permisos') : 'Desactivada' })
          ]),
          sw
        ]),
        body
      ]));
    });
    document.getElementById('counter').textContent = featCount + ' funcionalidades · ' + permCount + ' permisos';
  }

  var snackTimer;
  function snack(text, kind) {
    var s = document.getElementById('snackbar');
    s.className = 'snackbar show ' + (kind || 'success');
    document.getElementById('snack-icon').textContent = kind === 'error' ? 'error_outline' : 'check_circle';
    document.getElementById('snack-text').textContent = text;
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { s.className = 'snackbar'; }, 4000);
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = Object.keys(state.on).filter(function (k) { return state.on[k]; }).length;
    if (n === 0) { snack('Activá al menos un permiso para el usuario.', 'error'); return; }
    var nombre = document.getElementById('nombre').value + ' ' + document.getElementById('apellido').value;
    snack('Usuario ' + nombre.trim() + ' creado con ' + n + ' permisos (prototipo: no se guarda).');
  });

  document.querySelectorAll('.nav-group > button').forEach(function (b) {
    b.addEventListener('click', function () {
      var g = b.parentElement; g.classList.toggle('open'); b.setAttribute('aria-expanded', g.classList.contains('open'));
    });
  });

  renderTiendas();
  renderFeatures();
</script>
</body>
</html>
